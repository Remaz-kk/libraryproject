<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
</head>
<body>

<h1>Edit Book</h1>

<form method="post">
    {% csrf_token %}

    <p>Title:
        <input type="text" name="title" value="{{ book.title }}">
    </p>

    <p>Price:
        <input type="number" step="0.01" name="price" value="{{ book.price }}">
    </p>

    <p>Quantity:
        <input type="number" name="quantity" value="{{ book.quantity }}">
    </p>

    <p>Rating:
        <input type="number" name="rating" value="{{ book.rating }}">
    </p>

    <p>Publisher:
        <select name="publisher">
            {% for pub in publishers %}
                <option value="{{ pub.id }}" {% if pub.id == book.publisher.id %}selected{% endif %}>
                    {{ pub.name }}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>Authors:
        <select name="authors" multiple>
            {% for author in authors %}
                <option value="{{ author.id }}"
                {% if author in book.authors.all %}selected{% endif %}>
                    {{ author.name }}
                </option>
            {% endfor %}
        </select>
    </p>

    <button type="submit">Update</button>
</form>

</body>
</html>
