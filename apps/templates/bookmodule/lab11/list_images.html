<h1>Students Images</h1>

<a href="/books/lab11/addimage/">Add Student Image</a>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Image</th>
        <th>Action</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>
            {% if student.image %}
                <img src="{{ student.image.url }}" width="100">
            {% endif %}
        </td>
        <td>
            <a href="/books/lab11/deleteimage/{{ student.id }}/">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
